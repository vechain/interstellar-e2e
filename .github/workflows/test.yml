name: Test

on:
  push:
  workflow_dispatch:
    inputs:
      thor-branch:
        description: 'Thor branch to test against'
        required: true
        default: 'v2.5.0'
      thor-repo:
        description: 'Thor repository (owner/repo)'
        required: false
        default: 'vechain/thor'
  workflow_call:
    inputs:
      thor-branch:
        type: string
        required: false
      thor-repo:
        type: string
        required: false
        default: vechain/thor

permissions:
  contents: read

jobs:
  e2e:
    name: e2e tests (interstellar)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache-dependency-path: |
            network/go.sum
            tests/go.sum

      - name: Get thor commit SHA
        id: thor-sha
        run: |
          SHA=$(gh api repos/${{ inputs.thor-repo || 'vechain/thor' }}/commits/${{ inputs.thor-branch || 'v2.5.0' }} --jq '.sha[:8]')
          echo "sha=$SHA" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Cache thor binary
        uses: actions/cache@v6
        with:
          path: /tmp/thor_*
          key: thor-binary-${{ inputs.thor-branch || 'v2.5.0' }}-${{ steps.thor-sha.outputs.sha }}-${{ hashFiles('network/setup/network.go') }}

      - name: Run e2e tests
        run: make test
        env:
          THOR_REPO: https://github.com/${{ inputs.thor-repo || 'vechain/thor' }}
          THOR_BRANCH: ${{ inputs.thor-branch || 'v2.5.0' }}
